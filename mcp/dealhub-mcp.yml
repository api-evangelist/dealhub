notes:
- >-
  A live MCP endpoint IS served from DealHub's own developer host at
  https://developers.dealhub.io/mcp. It answers JSON-RPC with a well-formed MCP
  error object rather than an HTML 404, which distinguishes it from a catch-all.
  `tools/list` returns -32001 "Authorization required" anonymously, so the real tool
  set and its inputSchemas cannot be enumerated without credentials. NO tool list is
  recorded here rather than a guessed one.
- >-
  The endpoint is the documentation MCP server that the ReadMe platform provisions
  for a hosted developer hub (confirmed by the x-readme-* CORS headers and the
  Render origin), not a DealHub-authored MCP server over the CPQ/billing APIs. Its
  tools are expected to be documentation search/retrieval over the same content the
  llms.txt indexes, not quote or subscription operations.
- >-
  DealHub markets "DealHub Native MCP" on https://dealhub.io/ai/ ("build & connect
  agents", "revenue capabilities for your agents") and lists "MCP Extensibility" on
  https://dealhub.io/pricing/, but publishes NO endpoint URL, no installation
  instructions, no tool catalog, and no MCP page in the developer portal
  (developers.dealhub.io/llms.txt contains zero MCP references). mcp.dealhub.io does
  not resolve; https://api.dealhub.io/mcp and https://dealhub.io/mcp both 404. The
  marketed native MCP surface is therefore NOT publicly documented and is not
  recorded here as existing.
- >-
  A third-party MCP server, `dealhub-admin-mcp` on npm, wraps the DealHub Version
  API locally. It is catalogued in packages/dealhub-packages.yml and is explicitly
  not first-party.
