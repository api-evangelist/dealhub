note: This crosswalk is emitted because DealHub has BOTH an OpenAPI surface (616 operations across 11 documents)
  and a live MCP endpoint — but the two cannot be bound, and that unbindability is the finding. The only MCP endpoint
  DealHub serves, https://developers.dealhub.io/mcp, returns -32001 "Authorization required" to an anonymous tools/list,
  and it is the ReadMe platform documentation MCP server rather than a DealHub-authored server over the CPQ or billing
  APIs. DealHub separately markets "DealHub Native MCP" on its AI page and lists "MCP Extensibility" on its pricing
  page while publishing no endpoint, no tool catalog and no MCP documentation. crosswalk[] is therefore EMPTY on
  purpose — mapping a tool set nobody has published would be fabrication. rest_only[] below is the complete, real
  REST capability surface that a DealHub MCP server would have to cover, grouped by the tag each operation actually
  carries in the published spec, so the gap is measurable the day a tool list appears.
