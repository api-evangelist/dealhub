                    status: Completed
                    summary:
                      success_count: 1
                      errors_count: 0
                      warnings:
                      - 'Missing currency in price item for SKU KY014X, using default currency: USD'
                      errors: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A secret token generated by a CPQ administrator.
  schemas:
    Version:
      type: object
      properties:
        name:
          type: string
          description: Name of the version.
        comment:
          type: string
          description: Comment provided during version creation.
        status:
          type: string
          description: Status of the version.
        version_id:
          type: string
          description: The unique identifier of the version.
    DuplicateVersionRequest:
      type: object
      required:
      - version_id
      - new_version_name
      properties:
        version_id:
          type: string
          maxLength: 16
          description: ID of the version that should be duplicated.
        new_version_name:
          type: string
          maxLength: 120
          description: Name for the new version.
        comment:
          type: string
          maxLength: 4000
          description: Comments for the newly created version.
        to_account_instance:
          type: string
          description: Instance name of the Account where the version should be duplicated to (e.g., for Sandbox to Production).
    ActivateVersionRequest:
      type: object
      required:
      - version_id
      properties:
        version_id:
          type: string
          maxLength: 16
          description: ID of the Version that should be activated.
    AsyncResponse:
      type: object
      properties:
        request_id:
          type: string
          description: The ID of the asynchronous request for tracking.
    Info:
      type: object
      properties:
        version_id:
          type: string
          description: The ID of the version for which products were retrieved.
        version_status:
          type: string
          description: The status of the version.
        compared_with_version_id:
          type: string
          description: The ID of the version that was replaced by this one upon activation.
        more_results_matching_the_request:
          type: boolean
          description: Flag indicating if more results are available for pagination.
        offset:
          type: string
          description: The offset used in the request.
        limit:
          type: string
          description: The limit used in the request.
        error:
          type: string
          description: Error message if not all requested data could be retrieved.
    ProductBasic:
      type: object
      properties:
        sku:
          type: string
          description: Product catalog unique identifier.
        name:
          type: string
          description: Product name.
        type:
          type: string
          enum:
          - PRODUCT
          - BUNDLE
          description: Type of the product.
        description:
          type: string
          description: Product description.
        price:
          type: object
          description: List of price & currency pairs.
          additionalProperties:
            type: string
        attributes:
          type: array
          description: List of all product attributes defined for the version.
          items:
            type: object
            additionalProperties:
              type: string
        bundle_items:
          type: array
          description: List of Product SKUs in the bundle (if type is BUNDLE).
          items:
            type: string
    VersionProductsResponse:
      type: object
      properties:
        info:
          $ref: '#/components/schemas/Info'
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductBasic'
    ProductsBySkuRequest:
      type: object
      required:
      - sku
      properties:
        version_id:
          type: string
          maxLength: 16
          description: ID of the version. If omitted, the active version is used.
        pricing_option:
          type: string
          enum:
          - MIN
          - MAX
          - FIRST
          description: Specifies which price to return for SKUs with multiple fixed prices.
        sku:
          type: array
          items:
            type: string
            maxLength: 200
          description: List of SKUs to retrieve.
    ProductAttribute:
      type: object
      properties:
        type:
          type: string
          enum:
          - DATE
          - TEXT
          - TEXT_LIST
          - NUMBER
          - BOOLEAN
          - COGS
        value:
          type: string
    ProductFactor:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the factor. Must match an existing factor name configured in the CPQ version.
        value:
          type: string
          default: '1'
          description: The factor value. This field may have a value even when the factor is not applicable.
        applicable:
          type: boolean
          default: false
          description: Indicates if the factor is applicable in the context of the assignment rule.
    ProposalAttribute:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          maxLength: 50
          description: The name of the proposal attribute.
        value:
          type: string
          maxLength: 2000
          description: Attribute value. If `null` is provided, the system will define this attribute as not applicable in
            the context of the assignment rule.
        applicable:
          type: boolean
          default: false
          description: Indicates if the attribute is applicable in the context of the assignment rule.
    VolumeDiscount:
      type: object
      description: 'Defines the volume discount tables associated with the pricing rule. The value must be a key-value map
        where each entry represents a pair in the format <code>&lt;factor_name&gt;: &lt;volume_discount_table_name&gt;</code>.
        The <code>factor_name</code> corresponds to the pricing factor (e.g., Quantity, Duration), and the value specifies
        the volume discount table applied to that factor.</br></br>Example:</br><code>"volume_discount": { "Quantity": "VolD1",
        "Duration": "VolD2" }</code>'
      example:
        Quantity: VolD1
        Duration: VolD2
      additionalProperties:
        type: string
    PricingRuleProduct:
      description: 'List of the product pricing rules. The order of the elements in this list determines the sequence in which
        the pricing rules are evaluated by the CPQ system. </br> If <code>advanced</code>: false`, the <code>pricing_rules</code>
        list should have only **1 rule definition** with <code>price_format</code>: BASIC`. </br> If such configuration won’t
        be provided in the request, the system will create a default rule with price <code>0</code>. </br> In case there are
        more than 1 rule in the <code>pricing_rules</code> list with <code>price_format</code>: BASIC`, the system will use
        the 1st definition and the rest will be ignored. </br> If <code>advanced</code>: true`, the <code>pricing_rules</code>
        list must have at least **1 rule definition** with <code>price_format</code>: ADVANCED`. Otherwise, the product won’t
        be created. '
      type: object
      required:
      - playbook
      - price_format
      - price_type
      - default_discount
      - name
      properties:
        playbook:
          type: string
          description: The name of the playbook where this rule should be evaluated.
        name:
          type: string
          maxLength: 256
          description: The name of the pricing rule.
        rule:
          type: string
          maxLength: 4096
          description: 'The business condition for <code>ADVANCED</code> price format. Mandatory if <code>price_format: ADVANCED</code>.'
        price:
          type: string
          maxLength: 4096
          description: The price amount or formula. Mandatory if <code>price_type</code> is <code>SOLID</code> or <code>ITEM</code>.
        price_format:
          type: string
          enum:
          - BASIC
          - ADVANCED
          description: 'During quotation, the system evaluates <code> pricing_rules</code> according to the product’s pricing
            configuration, specifically the <code>advanced</code> flag defined in <code>products_pricing</code>. </br>If <code>advanced:
            false</code>, the CPQ engine will **only evaluate rules with** <code>price_format: BASIC</code>. Any rules in
            the <code>pricing_rules</code> list defined with <code>price_format: ADVANCED</code> will be ignored, even if
            multiple such rules are provided.</br> In other words, when advanced pricing is disabled at the product level,
            all <code>ADVANCED</code> pricing rules are excluded from the quotation flow.'
        price_type:
          description: 'This field defines the price calculation type.</br></br>Available values:</br></br>• <code>SOLID</code></br>Fixed
            price value.</br></br>• <code>ITEM</code></br>Price is based on another SKU in the catalog.</br>Format of the
            <code>price</code> field:</br><code>&lt;BASE_SKU&gt;;%;&lt;PERCENTAGE_OF_BASE_PRICE&gt;</code></br>Example:</br><code>"price":
            "SKU1;%;90"</code></br>Result: 90% of SKU1 price.</br></br>• <code>GROUP</code></br>Price is based on products
            in the proposal that have specific catalog tag(s).</br>Format of the <code>price</code> field:</br><code>&lt;LIST_OF_TAGS&gt;;&lt;PERCENTAGE_OF_BASE_PRICE&gt;;&lt;WHICH_PRICE_TO_USE&gt;;&lt;HOW_TO_USE_PRICE&gt;;</code></br>Example:</br><code>"price":
            "SUPPORT,SW;50;BOTH;AS_IS;"</code></br>Result: 50% of products tagged SUPPORT or SW.</br></br>• <code>FROM_ALL_QUOTE</code></br>Price
            is based on all other products in the proposal.</br>Format of the <code>price</code> field:</br><code>&lt;PERCENTAGE_OF_OTHER_PRODUCTS_PRICE&gt;</code></br>Example:</br><code>"price":
            "10"</code></br>Result: 10% of the total price of all other products.</br></br>• <code>NEGATIVE</code></br>Used
            for negative price products (e.g., discounts). The <code>price</code> value must be negative.</br></br>• <code>GROUP_NEGATIVE</code></br>Negative
            price based on products in the proposal with specific catalog tag(s). By default, only negative products with
            the specified tags are considered. To include positive products, set <code>"include_positive": true</code>.</br>Format
            of the <code>price</code> field:</br><code>&lt;LIST_OF_TAGS&gt;;&lt;PERCENTAGE_OF_BASE_PRICE&gt;;&lt;WHICH_PRICE_TO_USE&gt;;&lt;HOW_TO_USE_PRICE&gt;;</code></br>Example:</br><code>"price":
            "SUN,FF5;30;NET;AS_IS;"</code></br>Result: 30% of negative products tagged SUN or FF5.</br></br>• <code>ERP</code></br>Price
            is retrieved from a third-party ERP system during proposal configuration.'
          type: string
          enum:
          - SOLID
          - FROM_ALL_QUOTE
          - ITEM
          - GROUP
          - NEGATIVE
          - GROUP_NEGATIVE
          - ERP
        currency:
          type: string
          description: This field defines how the <code>price</code> value in the pricing rule should be interpreted, especially
            for tenant accounts configured with multiple currencies.</br></br>Available values:</br></br>• <code>EXCHANGE_RATE</code>
            (default)</br>Use when the <code>price</code> represents the MSRP in the default account currency. The amount
            will be converted to the proposal currency configured in CPQ.</br></br>• <code>NO_EXCHANGE_RATE</code></br>Use
            when the system should treat the <code>price</code> as an absolute value, without performing any currency conversion.</br></br>•
            <code>&lt;ISO-4217 code&gt;</code></br>Use when a specific currency is explicitly defined for the <code>price</code>
            and no currency exchange should be performed (e.g., USD, EUR, BRL).</br></br>If <code>null</code> or an empty
            string is provided, the system treats it as <code>EXCHANGE_RATE</code>. If the price is defined in the default
            account currency, this field may be <code>null</code>.
        dynamic_price:
          type: boolean
          default: false
          description: Specifies if a seller is allowed to overwrite the list price during proposal configuration. Not applicable
            when `price_type` is `ERP` or `ITEM`.
        rounding_policy:
          type: string
          description: 'This field defines the ID of the rounding policy explicitly associated with the pricing rule. It is
            relevant only when a non-default rounding policy must be applied.</br></br>Default: <code>null</code>.</br></br>If
            a value is provided (not <code>null</code>), the following conditions must be met:</br>1. The account flag <code>enable_rounding_policy</code>
            must be set to <code>true</code>.</br>2. The <code>price_item_type</code> must be <code>ADVANCED</code>.</br>3.
            The <code>price_item_currency</code> must not be <code>NO_EXCHANGE_RATE</code>.</br>4. The value must reference
            an existing rounding policy ID in the system.</br></br>If any of these conditions are not satisfied, the rounding
            policy will not be applied.'
        max_discount:
          type: integer
          minimum: 0
          maximum: 100
          description: Maximum allowed discount percentage.
        default_discount:
          type: integer
          minimum: 0
          maximum: 100
          description: Default discount percentage.
        apply_to:
          type: string
          enum:
          - ASSIGNMENT_RULES
          - GENERATED_ITEMS
          default: GENERATED_ITEMS
          description: Specifies if the rule applies to all assignments or specific ones.
        apply_to_templates:
          type: string
          description: Comma-separated list of assignment template names for which this pricing rule should be evaluated.
            Relevant when `apply_to` is `ASSIGNMENT_RULES`.
        apply_to_rules:
          type: string
          description: Comma-separated list of assignment rule names for which this pricing rule should be evaluated. Relevant
            when `apply_to` is `ASSIGNMENT_RULES`.
        level:
          type: integer
          enum:
          - 0
          - 1
          - 2
          default: 0
          description: The level to be included in the price calculation.
        note:
          type: string
          maxLength: 4096
          description: A free text note for the rule.
        based_of_tags:
          type: string
          description: 'This field specifies the catalog tags used as the baseline for price calculation. The system will
            sum the prices of products in the proposal that contain the specified tags and use that total as the base amount
            to calculate the price of the current product.</br></br>Value format: comma-separated list of tags.</br></br>This
            field must be provided when <code>price_type</code> is <code>GROUP</code> or <code>GROUP_NEGATIVE</code>.'
        based_of_price:
          type: string
          enum:
          - UNIT
          - NET
          - LIST
          - BOTH
          - USER
          - MSRP
          description: 'Specifies which price of the referenced product(s) (matched by <code>based_on_tags</code>) should
            be used as the base amount for tag-based price calculations.</br></br>When <code>price_type</code> is <code>GROUP</code>,
            valid values are: <code>UNIT</code>, <code>NET</code>, <code>LIST</code>, <code>BOTH</code>, <code>USER</code>,
            <code>MSRP</code>.</br></br>When <code>price_type</code> is <code>GROUP_NEGATIVE</code>, valid values are: <code>NET</code>,
            <code>LIST</code>.'
        limit_type:
          type: string
          enum:
          - MIN
          - MAX
          - AS_IS
          - RANGE
          description: The limit type for tag-based prices. Required if <code>price_type</code> is <code>GROUP</code> or <code>GROUP_NEGATIVE</code>.
        limit_min_value:
          type: number
          description: The minimum limit value for tag-based prices. Required if <code>limit_type</code> is <code>MIN</code>
            or <code>RANGE</code>.
        limit_max_value:
          type: number
          description: The maximum limit value for tag-based prices. Required if <code>limit_type</code> is <code>MAX</code>
            or <code>RANGE</code>.
        disable_rounding:
          type: boolean
          description: Specifies if rounding for the price should be disabled.
        include_positive:
          type: boolean
          description: Applicable only when <code>price_type</code> is <code>GROUP_NEGATIVE</code>. Determines whether products
            with positive prices should also be included in the base amount calculation for the current rule. By default,
            only products with negative prices (matched by the specified tags) are included. When set to <code>true</code>,
            both positive- and negative-priced products are considered in the calculation.
        volume_discount:
          $ref: '#/components/schemas/VolumeDiscount'
    ProductPricingProduct:
      type: object
      required:
      - pricing_rules
      properties:
        advanced:
          type: boolean
          default: false
          description: Set to `true` for advanced pricing policy, `false` for basic. <br/> When you set `advanced` to `true`,
            the `pricing_rules.name is required.
        pricing_rules:
          type: array
          description: 'List of the product pricing rules. The order of the elements determines the sequence in which they
            are evaluated. If `advanced` is `false`, the list must contain exactly one rule with `price_format: BASIC` — if
            not provided, a default rule with price `0` is created; if more than one `BASIC` rule is provided, only the first
            is used. If `advanced` is `true`, the list must contain at least one rule with `price_format: ADVANCED`; otherwise
            the product will not be created.'
          items:
            $ref: '#/components/schemas/PricingRuleProduct'
    ProductPricing:
      type: object
      required:
      - pricing_rules
      properties:
        advanced:
          type: boolean
          default: false
          description: Set to `true` for advanced pricing policy, `false` for basic.
        pricing_rules:
          type: array
          description: 'List of the bundle pricing rules. The order of the elements determines the sequence in which they
            are evaluated. If `advanced` is `false`, the list must contain exactly one rule with `price_format: BASIC` — if
            not provided, a default rule with price `0` is created; if more than one `BASIC` rule is provided, only the first
            is used. If `advanced` is `true`, the list must contain at least one rule with `price_format: ADVANCED`; otherwise
            the bundle will not be created.'
          items:
            $ref: '#/components/schemas/PricingRuleProduct'
    AssignmentRuleProduct:
      type: object
      required:
      - name
      - rule
      - product_factors
      properties:
        ordinal:
          type: integer
          description: The order in which the rule is evaluated.
        name:
          type: string
          maxLength: 200
          description: The name of the assignment rule. Must be unique in the context of this SKU. If an empty value is provided,
            the system will use the `ordinal` value as the rule name.
        rule:
          type: string
          maxLength: 2048
          default: 'false'
          description: The business condition that should trigger the rule. Send `null` if `assignment` is `NEVER`.
        note:
          type: string
          maxLength: 4096
          description: A free text note.
        product_factors:
          type: array
          items:
            $ref: '#/components/schemas/ProductFactor'
          maxItems: 4
          description: 'The list of available product factors configured in the context of the current assignment rule. At
            least one factor must have `applicable: true` with an explicit `value` defined; otherwise the rule creation will
            fail.'
        proposal_attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProposalAttribute'
          description: 'The list of available proposal attributes configured in the context of the current assignment rule.
            If not specified, all proposal attributes will be treated as `applicable: true` and will receive an empty value.'
    AssignmentRule:
      type: object
      required:
      - name
      - rule
      - product_factors
      properties:
        ordinal:
          type: integer
          description: The order in which the rule is evaluated.
        name:
          type: string
          maxLength: 200
          description: The name of the assignment rule. Must be unique in the context of this SKU. If an empty value is provided,
            the system will use the `ordinal` value as the rule name.
        rule:
          type: string
          maxLength: 2048
          default: 'false'
          description: The business condition that should trigger the rule. Send `null` if `assignment` is `NEVER`.
        note:
          type: string
          maxLength: 4096
          description: A free text note.
        product_factors:
          type: array
          items:
            $ref: '#/components/schemas/ProductFactor'
          maxItems: 4
          description: 'The list of available product factors configured in the context of the current assignment rule. At
            least one factor must have `applicable: true` with an explicit `value` defined; otherwise the rule creation will
            fail.'
        proposal_attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProposalAttribute'
          description: 'The list of available proposal attributes configured in the context of the current assignment rule.
            If not specified, all proposal attributes will be treated as `applicable: true` and will receive an empty value.'
    ProductAssignment:
      type: object
      required:
      - playbook
      properties:
        assignment:
          type: string
          enum:
          - RULE_BASED
          - ALWAYS
          - NEVER
          default: NEVER
          description: Directive for the product assignment. At least one rule must be provided in `assignment_rules` when
            this value is `RULE_BASED` or `ALWAYS`; otherwise the SKU creation will fail.
        playbook:
          type: string
          description: The name of the existing playbook to which the assignment rules are meant to be applied.
        assignment_rules:
          type: array
          description: List of assignment rules. The order of the elements in this list determines the sequence in which the
            rules are evaluated by the CPQ system. Must be an empty list if `assignment` is `NEVER`.
          items:
            $ref: '#/components/schemas/AssignmentRuleProduct'
        assignment_templates:
          type: array
          readOnly: true
          items:
            type: string
    BundleAssignment:
      type: object
      required:
      - playbook
      properties:
        assignment:
          type: string
          enum:
          - RULE_BASED
          - ALWAYS
          - NEVER
          default: NEVER
          description: Directive for the bundle assignment. At least one rule must be provided in `assignment_rules` when
            this value is `RULE_BASED` or `ALWAYS`; otherwise the SKU creation will fail.
        playbook:
          type: string
          description: The name of the existing playbook to which the assignment rules are meant to be applied.
        assignment_rules:
          type: array
          description: List of assignment rules. The order of the elements in this list determines the sequence in which the
            rules are evaluated by the CPQ system. Must be an empty list if `assignment` is `NEVER`.
          items:
            $ref: '#/components/schemas/AssignmentRule'
        assignment_templates:
          type: array
          readOnly: true
          items:
            type: string
    ConditionalName:
      type: object
      required:
      - playbook
      properties:
        playbook:
          type: string
          description: The name of the playbook.
        ordinal:
          type: integer
          description: 'The order in which the system evaluates the conditional name rules. For example, the rule with `ordinal:
            0` is evaluated first.'
        rule:
          type: string
          maxLength: 2048
          description: The business condition that the system should evaluate.
        name:
          type: string
          maxLength: 400
          description: The name to be assigned to the specific product instance when the business condition (rule) evaluates
            to `true`.
        description:
          type: string
          maxLength: 8192
          description: The description to be assigned to the specific product instance when the business condition (rule)
            evaluates to `true`.
    InheritedAttribute:
      type: object
      properties:
        name:
          type: string
          description: The name of the proposal attribute.
        inherit:
          type: boolean
          description: Set to true to inherit the value from the bundle attribute.
    BundleItem:
      type: object
      required:
      - sku
      properties:
        sku:
          type: string
          description: The unique identifier of the product in the catalog.
        ordinal:
          type: integer
          default: 0
          description: The order of the product in the bundle.
        how_to_add:
          type: string
          enum:
          - AUTOMATIC
          - MANUAL
          - COMBINED
          description: Specifies how the product should be managed within the bundle during proposal configuration. For `FIXED_PRICE`
            bundles, only `AUTOMATIC` is valid. For `PRODUCT_SUMMARY` bundles, valid values are `AUTOMATIC`, `MANUAL`, and
            `COMBINED`.
        enable_modify_factors:
          type: boolean
          description: Specifies if the seller is allowed to modify bundled product factors (e.g. quantity, duration). Relevant
            for `PRODUCT_SUMMARY` bundles only.
        product_factors:
          type: array
          description: The list of product factors configured for this product in the context of the current bundle.
          items:
            $ref: '#/components/schemas/ProductFactor'
        inherit_proposal_attributes:
          type: array
          items:
            $ref: '#/components/schemas/InheritedAttribute'
          description: List of attributes that should inherit their value from the parent bundle.
    ProductCatalogItem:
      type: object
      required:
      - sku
      - name
      - product_assignments
      properties:
        sku:
          type: string
          maxLength: 200
          description: The unique identifier of the product in the catalog.
        name:
          type: string
          maxLength: 400
          description: The product name.
        description:
          type: string
          maxLength: 21844
          description: The product description.
        tags:
          type: array
          description: List of tags associated with the specific product.
          items:
            type: string
            maxLength: 200
        primary_tag:
          type: string
          maxLength: 200
          description: Primary tag of the specific product.
        merge_products:
          type: boolean
          default: false
          description: Identifies if multiple instances of this product should be merged into a single line during proposal
            configuration.
        product_attributes:
          type: object
          description: List of product attributes with their respective values. Note that product attributes must be declared
            in the CPQ version. Use ‘;’ as a delimiter for product attribute type TEXT_LIST.
          additionalProperties:
            $ref: '#/components/schemas/ProductAttribute'
        product_assignments:
          type: array
          description: List of product assignment rules defined for the product. The structure of each element in the list
            is defined in the product_assignments Structure section.
          items:
            $ref: '#/components/schemas/ProductAssignment'
        product_pricing:
          description: 'List of pricing definitions for the specific SKU. Note: if no pricing is configured for a specific
            SKU, the system will not instantiate an instance of that product (i.e., a line item) during the proposal configuration
            process, even if the assignment rule matches the business conditions. Can be an empty list if `assignment` is
            `NEVER`.'
          $ref: '#/components/schemas/ProductPricingProduct'
        product_conditional_names:
          type: array
          description: List of ‘conditional name’ rules for the specific SKU. The structure of each element in the list is
            defined in the product_conditional_names Structure section.
          items:
            $ref: '#/components/schemas/ConditionalName'
    BundleCatalogItem:
      type: object
      required:
      - sku
      - name
      - product_assignments
      - bundle_items
      properties:
        sku:
          type: string
          maxLength: 200
          description: The unique identifier of the bundle in the catalog.
        name:
          type: string
          maxLength: 400
          description: The bundle name.
        description:
          type: string
          maxLength: 21844
          description: The bundle description.
        tags:
          type: array
          description: List of tags associated with the specific bundle. Use ';' as a delimiter between tags.
          items:
            type: string
            maxLength: 200
        primary_tag:
          type: string
          maxLength: 200
          description: Primary tag of the specific bundle.
        product_attributes:
          type: object
          description: 'List of bundle attributes and their values. Each entry is a key-value pair formatted as `"<attribute_name>":
            { "value": "<attribute_value>" }`. Use '';'' as a delimiter for attribute type TEXT_LIST. Attribute names must
            not exceed 50 characters and attribute values must not exceed 2000 characters.'
          additionalProperties:
            $ref: '#/components/schemas/ProductAttribute'
        product_assignments:
          type: array
          description: List of bundle assignment rules defined for the bundle. The structure of each element in the list is
            defined in the product_assignments Structure section.
          items:
            $ref: '#/components/schemas/BundleAssignment'
        product_pricing:
          description: List of pricing definitions for the specific SKU. The structure of each element in the list is defined
            in the product_pricing Structure section.
          $ref: '#/components/schemas/ProductPricing'
        product_conditional_names:
          type: array
          description: List of the product conditional names. The structure of each element in the list is defined in the
            product_conditional_names Structure section.
          items:
            $ref: '#/components/schemas/ConditionalName'
        bundle_type:
          type: string
          description: The type of the bundle.
          enum:
          - FIXED_PRICE
          - PRODUCT_SUMMARY
          default: PRODUCT_SUMMARY
        price_in_bundle_is_zero:
          type: boolean
          description: This field determines whether the price of bundled products (aka items within the bundle) should be
            displayed in the proposal as $0.
          default: false
        sync_to_crm:
          type: boolean
          description: This field specifies if the bundle should be synchronized to CRM.
          default: false
        sync_bundle_price:
          type: boolean
          description: Determines how the bundle price should be synchronized to CRM. Set to `true` to synchronize the price
            at the bundle level. Set to `false` to synchronize the price at the bundled items level — in this case, the bundle
            price will be synced as 0.
          default: false
        bundle_items:
          type: array
          description: List of the products included into the bundle. The structure of each element in the list is defined
            in the bundle_items Structure section.
          items:
            $ref: '#/components/schemas/BundleItem'
    ProductHierarchyNode:
      type: object
      properties:
        nameOrSku:
          type: string
          description: The SKU of the product/bundle or the name of the label.
        type:
          type: string
          enum:
          - PRODUCT
          - BUNDLE
          - LABEL
          description: The type of the hierarchy item.
        mandatory:
          type: boolean
          description: Whether the item is mandatory.
        alternative:
          type: boolean
          description: Whether the item is an alternative choice.
        children:
          type: array
          items:
            $ref: '#/components/schemas/ProductHierarchyNode'
          description: A nested list of child items.
    ProductCatalogGetResponse:
      type: object
      properties:
        info:
          description: Basic information about returned payload
          $ref: '#/components/schemas/Info'
        products:
          type: array
          description: 'List of products matching specified criteria. Each element in the list contains the following information:'
          items:
            $ref: '#/components/schemas/ProductCatalogItem'
        bundles:
          type: array
          description: 'List of bundles matching specified criteria. Each element in the list contains the following information:'
          items:
            $ref: '#/components/schemas/BundleCatalogItem'
    ProductCatalogPostRequest:
      type: object
      properties:
        products:
          type: array
          description: 'List of products that should be created in the products catalog. Each element in the list contains
            the following information:'
          items:
            $ref: '#/components/schemas/ProductCatalogItem'
        bundles:
          type: array
          description: 'List of bundles that should be created in the products catalog. Each element in the list contains
            the following information:'
          items:
            $ref: '#/components/schemas/BundleCatalogItem'
    ProductCatalogPatchProduct:
      type: object
      description: Represents an existing product whose data elements should be updated. Only `sku` is required. Include only
        the data categories (`product_attributes`, `product_assignments`, `product_pricing`) that should be updated; omitted
        categories are left untouched.
      required:
      - sku
      properties:
        sku:
          type: string
          maxLength: 200
          description: The unique identifier of an existing product in the catalog.
        product_attributes:
          type: object
          description: 'Product attributes to update. Each entry is a key-value pair formatted as `"<attribute_name>": { "value":
            "<attribute_value>" }`. Attribute names must not exceed 50 characters; attribute values must not exceed 2000 characters.
            Use `;` as a delimiter for `TEXT_LIST` attribute types. Attributes must be pre-declared in the CPQ version.'
          additionalProperties:
            $ref: '#/components/schemas/ProductAttribute'
        product_assignments:
          type: array
          description: Assignment rules to update for this product. The structure of each element is the same as in the POST
            endpoint. If `assignment` is `RULE_BASED` or `ALWAYS`, at least one rule must be provided.
          items:
            $ref: '#/components/schemas/ProductAssignment'
        product_pricing:
          description: Pricing definitions to update for this product. Can be an empty list if `assignment` is `NEVER`.
          $ref: '#/components/schemas/ProductPricingProduct'
    ProductCatalogPatchBundle:
      type: object
      description: Represents an existing bundle whose data elements should be updated. Only `sku` is required. Include only
        the data categories (`product_attributes`, `product_assignments`, `product_pricing`, `bundle_items`) that should be
        updated; omitted categories are left untouched.
      required:
      - sku
      properties:
        sku:
          type: string
          maxLength: 200
          description: The unique identifier of an existing bundle in the catalog.
        product_attributes:
          type: object
          description: 'Bundle attributes to update. Each entry is a key-value pair formatted as `"<attribute_name>": { "value":
            "<attribute_value>" }`. Attribute names must not exceed 50 characters; attribute values must not exceed 2000 characters.
            Use `;` as a delimiter for `TEXT_LIST` attribute types.'
          additionalProperties:
            $ref: '#/components/schemas/ProductAttribute'
        product_assignments:
          type: array
          description: Assignment rules to update for this bundle. If `assignment` is `RULE_BASED` or `ALWAYS`, at least one
            rule must be provided.
          items:
            $ref: '#/components/schemas/BundleAssignment'
        product_pricing:
          description: Pricing definitions to update for this bundle. Can be an empty list if `assignment` is `NEVER`.
          $ref: '#/components/schemas/ProductPricing'
        bundle_items:
          type: array
          description: Products to update within this bundle. Each referenced SKU must already exist in the catalog.
          items:
            $ref: '#/components/schemas/BundleItem'
    ProductCatalogPatchRequest:
      type: object
      description: Request body for the PATCH product catalog endpoint. Include only the products and/or bundles whose data
        elements should be updated.
      properties:
        products:
          type: array
          description: List of existing products whose data elements should be updated. Each element must reference an existing
            SKU in the catalog.
          items:
            $ref: '#/components/schemas/ProductCatalogPatchProduct'
        bundles:
          type: array
          description: List of existing bundles whose data elements should be updated. Each element must reference an existing
            bundle SKU in the catalog.
          items:
            $ref: '#/components/schemas/ProductCatalogPatchBundle'
    RequestStatus:
      type: object
      properties:
        request_id:
          type: string
          description: ID of the asynchronous request.
        status:
          type: string
          enum:
          - in-progress
          - done
          - failed
          - queued
          description: Status of the asynchronous request.
        error_description:
          type: string
          description: Description of the error if the status is 'failed'.
        error_code:
          type: string
          description: Code of the error if the status is 'failed'.
    RequestSummary:
      type: object
      properties:
        success_count:
          type: integer
          description: The number of successfully processed records.
        errors_count:
          type: integer
          description: The number of records that could not be processed.
        warnings:
          type: array
          items:
            type: string
            description: List of warnings that occurred during execution.
        errors:
          type: array
          items:
            type: string
          description: List of errors that occurred during execution.
    RequestSummaryResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - In Progress
          - Completed
          - Error
          description: The status of the asynchronous request.
        summary:
          $ref: '#/components/schemas/RequestSummary'
    PlaybookSyncSettings:
      type: object
      properties:
        enabled:
          type: string
          description: 'Sync configuration mode. Valid values: `ALWAYS`, `RULE_BASED`, `DISABLED`.'
        based_on:
          type: string
          nullable: true
          description: Question ID used for the rule. Returns `null` when no rule applies.
    PlaybookMetadata:
      type: object
      properties:
        name:
          type: string
          description: Internal playbook name.
        display:
          type: string
          description: Playbook display name.
        document_type:
          type: array
          items:
            type: string
            enum:
            - PDF
            - WORD
            - EXCEL
            - DEALROOM
          description: List of allowed proposal document types.
        geo_factors_settings:
          type: boolean
          description: Enables geo factor logic.
        present_proposal_summary:
          type: boolean
          description: Shows the proposal summary.
        enable_partner_support:
          type: boolean
          description: Indicates whether partner support is enabled.
        sync_docs_settings:
          allOf:
          - $ref: '#/components/schemas/PlaybookSyncSettings'
          description: Sync docs configuration.
        sync_products_settings:
          allOf:
          - $ref: '#/components/schemas/PlaybookSyncSettings'
          description: Sync products configuration.
    PlaybookQuestion:
      type: object
      properties:
        question_id:
          type: string
          description: Unique question ID.
        question:
          type: string
          description: Question label/text.
        question_type:
          type: string
          description: 'Type of question. Valid values: `text`, `text_list`, `numeric`, `date`.'
        answers:
          type: string
          description: Possible answers, separated by a semicolon.
        default_answer:
          type: string
          nullable: true
          description: Default answer used for API template generation.
    PlaybookGroup:
      type: object
      properties:
        group_id:
          type: string
          description: Unique group identifier.
        group_name:
          type: string
          description: Display name of the group.
        group_type:
          type: string
          enum:
          - QUESTIONS_GROUP
          - REPEATABLE_GROUP
          description: Group type.
        group_external_object:
          type: string
          nullable: true
          description: External object reference.
        question_data:
          type: array
          items:
            $ref: '#/components/schemas/PlaybookQuestion'
          description: List of questions in the group.
    PlaybookExportResponse:
      type: object
      properties:
        playbook_metadata:
          allOf:
          - $ref: '#/components/schemas/PlaybookMetadata'
          description: Playbook configuration metadata.
        playbook_data:
          type: array
          items:
            $ref: '#/components/schemas/PlaybookGroup'
          description: List of question groups in the Playbook.
    QuoteTemplatePartnerProgram:
      type: object
      properties:
        partner_level_name:
          type: string
          description: Partner level name.
        program_name:
          type: string
          description: Partner program name.
    QuoteTemplateQuoteData:
      type: object
      properties:
        group_id:
          type: string
          maxLength: 50
          description: DealHub group ID. Required for each group in `quote_data`.
        questions:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
            description: Keys are `question_id`, values are answers. Multi-select answers use the `;` delimiter.
          description: Required. List of question answers. The template uses the default answer or the first answer for each
            question.
    QuoteTemplatePartnerProgramData:
      type: object
      description: Partner program-specific discounts.
      properties:
        partner_program_name:
          type: string
          maxLength: 200
          description: Partner program name.
        partner_level_item_price:
          type: number
          format: double
          description: Partner level item price.
        partner_level_item_discount:
          type: number
          format: double
          description: Partner level item discount.
    QuoteTemplateLineItem:
      type: object
      properties:
        sku:
          type: string
          description: Required. Product catalog identifier. Must exist in the DealHub catalog.
        item_name:
          type: string
          maxLength: 400
          description: Optional. Catalog product name.
        bundle_ref_sku:
          type: string
          description: Conditionally required. Bundle SKU reference. Required if part of a bundle; empty for the bundle product
            itself.
        bundle_ref_id:
          type: integer
          description: Conditionally required. Unique bundle instance ID. Required for items within a bundle and for the bundle
            itself.
        list_price:
          type: number
          format: double
          description: Required. List price. Positive or negative.
        net_price_per_unit:
          type: number
          format: double
          description: Optional. Net price per unit.
        net_price:
          type: number
          format: double
          description: 'Required. Total net price: net per unit multiplied by product factors.'
        msrp:
          type: number
          format: double
          description: Required. Line item MSRP. Positive or negative.
        msrp_discount:
          type: number
          format: double
          description: Required. Discount applied to MSRP. Positive or negative.
        sales_discount:
          type: number
          format: double
          description: Required. Sales discount. Positive or negative.
        total_discount:
          type: number
          format: double
          description: Required. Total discount. Positive or negative.
        product_factors:
          type: object
          additionalProperties: true
          description: Required. Product-specific factors (quantity, duration) as key-value pairs.
        attributes:
          type: object
          additionalProperties: true
          description: Optional. Line-item-specific proposal attributes as key-value pairs.
        partner_program_data:
          type: array
          items:
            $ref: '#/components/schemas/QuoteTemplatePartnerProgramData'
          description: Optional. Partner program-specific discounts.
    GenerateQuoteTemplateResponse:
      type: object
      description: Preformatted JSON template for the Generate Quote API, based on the Playbook structure.
      properties:
        external_opportunity_id:
          type: string
          maxLength: 50
          description: Required. CRM opportunity ID. Required in all requests.
        request_action:
          type: string
          enum:
          - draft
          - submit
          - publish
          - sign_externally
          description: Required. Action for the quote. Enum, lowercase.
        line_item_details:
          type: string
          enum:
          - basic
          - all
          default: basic
          description: Optional. Level of line item detail. `basic` includes SKU, bundle_ref, name, net price, list price,
            total discount, and product_factors.
        playbook:
          type: string
          maxLength: 50
          description: Optional. Unique name of the playbook (UTF-8). If missing, the system uses the first API-type playbook.
        quote_name:
          type: string
          maxLength: 250
          description: Optional. Quote or proposal name. The system default applies if missing; an error occurs if no default
            exists.
        dealroom_publish_name:
          type: string
          maxLength: 250
          description: Optional. DealRoom publish name. The system default applies if missing; an error occurs if no default
            exists.
        total_sales_discount:
          type: number
          format: double
          description: Optional. Total discount for all line items. Overrides individual line item discounts if provided.
        expiration_date:
          type: string
          description: Optional. Quote expiration date as a Unix timestamp in milliseconds (GMT). Must not be in the past;
            the system default applies if missing.
        document_type:
          type: string
          enum:
          - DealRoom
          - PDF
          - WORD
          - EXCEL
          description: Required. Type of document.
        timezone_offset:
          type: number
          minimum: -12
          maximum: 14
          default: 0
          description: Optional. Timezone offset from GMT.
        partner_program:
          type: array
          items:
            $ref: '#/components/schemas/QuoteTemplatePartnerProgram'
          description: Optional. Selected partner programs.
        quote_data:
          type: array
          items:
            $ref: '#/components/schemas/QuoteTemplateQuoteData'
          description: Required. List of question groups and answers.
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteTemplateLineItem'
          description: Optional. List of line items.
        sign_externally_comment:
          type: string
          maxLength: 1000
          description: Conditionally required. Comment for external signing. Required if `request_action` = `sign_externally`.
    PlaybookErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message.
        code:
          type: integer
          description: HTTP status code.
