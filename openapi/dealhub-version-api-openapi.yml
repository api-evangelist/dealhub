    patch:
      tags:
      - Product Catalog
      summary: Update Product Catalog Items
      description: 'Asynchronously updates specific data elements for existing SKUs in a `DRAFT` version''s product catalog.
        Unlike the POST endpoint, this endpoint **does not** create new products — it only modifies data elements for SKUs
        that already exist in the catalog.


        This endpoint operates in one of two modes, defined by the `mode` query parameter:


        **UPDATE mode**: Only the data elements explicitly included in the request body are added or updated. Any existing
        data not referenced in the request remains unchanged.


        **REPLACE mode**: Each data category included in the request (e.g., `product_attributes`, `pricing_rules`) completely
        replaces the corresponding data for that SKU. Entries within an included category that are not present in the request
        are removed. Categories not referenced at all in the request are left untouched.


        This operation returns a `request_id` for you to track the progress. Requests targeting an `ACTIVE` or `DEACTIVATED`
        version will fail.'
      operationId: updateProductCatalogItems
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 16
        description: The identifier of the `DRAFT` version whose catalog should be updated.
      - name: mode
        in: query
        required: true
        schema:
          type: string
          enum:
          - UPDATE
          - REPLACE
        description: The update mode. `UPDATE` merges the provided data with existing data for each SKU; unspecified data
          is preserved. `REPLACE` replaces all entries within each included data category; entries not present in the request
          are removed from that category.
      requestBody:
        required: true
