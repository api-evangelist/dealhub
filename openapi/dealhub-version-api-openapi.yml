  /api/v1/request/{request_id}/status:
    get:
      tags:
      - Asynchronous Operations
      summary: Get Asynchronous Request Status
      description: Polls and retrieves the current status of a specific asynchronous request (e.g., duplicate version, activate
        version).
      operationId: getAsyncRequestStatus
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
