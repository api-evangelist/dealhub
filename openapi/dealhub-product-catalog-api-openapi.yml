        taxRateId:
          type: string
          format: uuid
          description: 'ID of the tax rate applied to this charge. To get a list of available tax rate IDs, call the [Get tax rates](/reference/gettaxrates) operation. DEPRECATED: Use taxRateStrategyId instead. (deprecated: use taxRateStrategyId)'
        taxRateStrategyId:
          type: string
          description: ID of the tax rate strategy applied to this charge. This determines how taxes are calculated when multiple tax rates apply.
        unitOfMeasureId:
          type: string
          format: uuid
          description: ID of the unit of measure for this charge (e.g., GB, users, licenses). To get a list of available unit of measure IDs, call the [Get units of measure](/reference/getunitsofmeasure) operation.
        isRenewable:
          type: boolean
          description: Indicates if the charge is renewable
        isCreditable:
          type: boolean
          description: Indicates if the charge can be credited
        isListPriceEditable:
          type: boolean
          description: Indicates if the list price can be edited
        minQuantity:
          type: integer
          format: int64
          description: Minimum quantity that must be ordered. Applicable only if the chargeModel is PER_UNIT or RATE_CARD_LOOKUP.
        defaultQuantity:
          type: integer
          format: int64
          description: Default quantity for this charge. Applicable only if the chargeModel is PER_UNIT or RATE_CARD_LOOKUP.
        maxQuantity:
          type: integer
          format: int64
          description: Maximum quantity that can be ordered. Applicable only if the chargeModel is PER_UNIT or RATE_CARD_LOOKUP.
        externalId:
          type: string
          description: External identifier for the charge, used for integration with other systems
        minAmount:
          type: number
          description: '**NOTE: This parameter is currently in beta**

            Minimum monetary amount for this charge. Applies only when `type` is `PERCENTAGE_OF`.'
        maxAmount:
          type: number
          description: '**NOTE: This parameter is currently in beta**

            Maximum monetary amount for this charge. Applies only when `type` is `PERCENTAGE_OF`.'
        recognitionRuleId:
          type: string
          description: ID of the revenue recognition rule associated with this charge
        erpId:
          type: string
          description: ERP system identifier for this charge
        itemCode:
          type: string
          description: Item code used for this charge in external systems
        targetPlanIds:
          type: array
          description: List of plan IDs that this PERCENTAGE_OF charge applies to
          items:
            type: string
        planId:
          type: string
          description: ID of the plan this charge belongs to
        amount:
          type: number
          description: The monetary amount for this charge
        type:
          type: string
          description: 'Type of charge: `ONE_TIME`, `RECURRING`, `USAGE`, `PREPAID`, or `PERCENTAGE_OF`.

            See also [Supported charge type and charge model combinations](/docs/charge-types-and-models#/supported-charge-type-and-charge-model-combinations).


            * `ONE_TIME`: Charge a one-time fee for a product or service that''s usually purchased only once, for example, an initial setup fee.

            * `RECURRING`: Charge a fee on a recurring basis. The `recurrence` object specifies the cadence.

            * `USAGE`: Charge customers based on their usage of the product or service.

            * `PREPAID`: Charge customers a certain price in advance of them using a product or service. Suitable for scenarios where the customer purchases the product or service for a fixed duration or usage limit.

            * `PERCENTAGE_OF`: Charge a percentage of a customer''s revenue gained from using your product or service. The price is calculated as a percentage of the total cost of one or more target plans. The `targetPlanIds` field specifies the plans that are targeted.'
          enum:
          - ONE_TIME
          - RECURRING
          - USAGE
          - PREPAID
          - PERCENTAGE_OF
        chargeModel:
          type: string
          description: 'Pricing model for the charge: `PER_UNIT`, `VOLUME`, `TIERED`, `FLAT_FEE`, `BLOCK`, or `RATE_CARD_LOOKUP`.

            See also [Supported charge type and charge model combinations](/docs/charge-types-and-models#/supported-charge-type-and-charge-model-combinations).


            * `PER_UNIT`: Charge a specific amount per unit of the product.

            * `VOLUME`: Offer a volume discount where per-unit cost decreases as the customer buys a larger number of product units.

            * `TIERED`: Define tiers with different per-unit prices based on number of units bought. Per-unit prices are applied successively starting with the first tier.

            * `FLAT_FEE`: Charge a fixed, flat amount on a set schedule regardless of plan usage. For example, charge a $10 flat fee per month.

            * `BLOCK`: Define product usage in tiered blocks and charge a specific amount per block based on the usage tier. For example, for an email marketing platform, charge $100 for a usage block of 1-500 emails, and $150 for a usage block of 500+ emails. A customer who wants to send 800 emails will purchase the 500+ block for $150.

            * `RATE_CARD_LOOKUP`: Use an existing rate card to price a product based on a combination of price attributes.'
          enum:
          - PER_UNIT
          - VOLUME
          - TIERED
          - FLAT_FEE
          - BLOCK
          - RATE_CARD_LOOKUP
        recurrence:
          $ref: '#/components/schemas/RecurrenceJson'
        priceTiers:
          type: array
          description: List of price tiers for tiered pricing models. Required only if the value of `chargeModel` is `TIERED`, `BLOCK` or `VOLUME`.
          items:
            $ref: '#/components/schemas/PriceTierJson'
        isDrawdown:
          type: boolean
          description: Indicates if this is a drawdown charge
        minimumCommitBaseChargeId:
          type: string
          description: ID of the base charge for minimum commit calculation
        overageBaseChargeId:
          type: string
          description: '**NOTE: This parameter is currently in beta**

            ID of the base charge for overage calculation'
        isCustom:
          type: boolean
          description: Indicates if this is a custom charge
        percent:
          type: number
          description: Percentage value for PERCENTAGE_OF charge types
        percentDerivedFrom:
          type: string
          description: For PERCENTAGE_OF charges, specifies if percentage is calculated from LIST_AMOUNT or SELL_AMOUNT
          enum:
          - LIST_AMOUNT
          - SELL_AMOUNT
        ledgerAccountMapping:
          $ref: '#/components/schemas/LedgerAccountMapping'
        durationInMonths:
          type: integer
          format: int64
          description: Duration of the charge in months (for time-limited charges)
        isEventBased:
          type: boolean
          description: Indicates if this charge is event-based rather than time-based
        isDiscount:
          type: boolean
          description: Indicates if this charge represents a discount
        rateCardId:
          type: string
          description: ID of the rate card for RATE_CARD_LOOKUP charge models
        billingTerm:
          type: string
          description: 'Billing term: UP_FRONT or IN_ARREARS'
          enum:
          - UP_FRONT
          - IN_ARREARS
        billingCycle:
          type: string
          description: 'Billing cycle: DEFAULT, CHARGE_RECURRENCE, PAID_IN_FULL, MONTH, QUARTER, SEMI_ANNUAL, YEAR'
          enum:
          - DEFAULT
          - CHARGE_RECURRENCE
          - PAID_IN_FULL
          - MONTH
          - QUARTER
          - SEMI_ANNUAL
          - YEAR
        shouldTrackArr:
          type: boolean
          description: Indicates if this charge should be included in Annual Recurring Revenue (ARR) calculations
        customFields:
          type: object
          description: Map of custom fields associated with this charge
          additionalProperties:
            $ref: '#/components/schemas/CustomFieldValue'
        custom:
          type: boolean
        eventObjectId:
          type: string
        drawdown:
          type: boolean
        eventBased:
          type: boolean
        creditable:
          type: boolean
      description: JSON object representing the charge details.
    LedgerAccount:
