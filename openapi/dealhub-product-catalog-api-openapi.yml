    servers:
    - url: https://api.dealhub.io
      description: The base URL for your DealHub instance.
      variables:
        your-dealhub-instance:
          default: app
          description: Your specific DealHub instance name (e.g., 'app', 'service-eu1').
  /api/v1/version/{version_id}/products_catalog/by_sku:
    delete:
      tags:
      - Product Catalog
      summary: Delete Specific Products by SKU
      description: "Deletes specific products from the product catalog of a `DRAFT` version. \n* This operation can only be triggered for a catalog version with a **`DRAFT`** status.\n* Requests made for an `ACTIVE` or `DEACTIVATED` catalog version will fail with a `400 Bad Request` HTTP error.\n\nA product cannot be deleted if it is:\n* A parent to another product in the hierarchy.\n* Marked as mandatory.\n* Set as an alternative in the hierarchy tree."
      operationId: deleteProductsBySku
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 16
        description: The identifier of the `DRAFT` version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skus:
                  type: array
                  items:
                    type: string
            examples:
              deleteBySkuExample:
                summary: Delete two specific SKUs
                value:
                  skus:
                  - SKU-1
                  - SKU-45
      responses:
        '200':
          description: Success. Specified products were deleted.
        '400':
          description: Bad Request.
      security:
      - bearerAuth: []
    servers:
    - url: https://api.dealhub.io
      description: The base URL for your DealHub instance.
      variables:
        your-dealhub-instance:
          default: app
          description: Your specific DealHub instance name (e.g., 'app', 'service-eu1').
components:
