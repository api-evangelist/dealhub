    PricingRuleProduct:
      description: 'List of the product pricing rules. The order of the elements in this list determines the sequence in which the pricing rules are evaluated by the CPQ system. </br> If <code>advanced</code>: false`, the <code>pricing_rules</code> list should have only **1 rule definition** with <code>price_format</code>: BASIC`. </br> If such configuration won’t be provided in the request, the system will create a default rule with price <code>0</code>. </br> In case there are more than 1 rule in the <code>pricing_rules</code> list with <code>price_format</code>: BASIC`, the system will use the 1st definition and the rest will be ignored. </br> If <code>advanced</code>: true`, the <code>pricing_rules</code> list must have at least **1 rule definition** with <code>price_format</code>: ADVANCED`. Otherwise, the product won’t be created. '
      type: object
      required:
      - playbook
      - price_format
      - price_type
      - default_discount
      - name
      properties:
        playbook:
          type: string
          description: The name of the playbook where this rule should be evaluated.
        name:
          type: string
          maxLength: 256
          description: The name of the pricing rule.
        rule:
          type: string
          maxLength: 4096
          description: 'The business condition for <code>ADVANCED</code> price format. Mandatory if <code>price_format: ADVANCED</code>.'
        price:
          type: string
          maxLength: 4096
          description: The price amount or formula. Mandatory if <code>price_type</code> is <code>SOLID</code> or <code>ITEM</code>.
        price_format:
          type: string
          enum:
          - BASIC
          - ADVANCED
          description: 'During quotation, the system evaluates <code> pricing_rules</code> according to the product’s pricing configuration, specifically the <code>advanced</code> flag defined in <code>products_pricing</code>. </br>If <code>advanced: false</code>, the CPQ engine will **only evaluate rules with** <code>price_format: BASIC</code>. Any rules in the <code>pricing_rules</code> list defined with <code>price_format: ADVANCED</code> will be ignored, even if multiple such rules are provided.</br> In other words, when advanced pricing is disabled at the product level, all <code>ADVANCED</code> pricing rules are excluded from the quotation flow.'
        price_type:
          description: 'This field defines the price calculation type.</br></br>Available values:</br></br>• <code>SOLID</code></br>Fixed price value.</br></br>• <code>ITEM</code></br>Price is based on another SKU in the catalog.</br>Format of the <code>price</code> field:</br><code>&lt;BASE_SKU&gt;;%;&lt;PERCENTAGE_OF_BASE_PRICE&gt;</code></br>Example:</br><code>"price": "SKU1;%;90"</code></br>Result: 90% of SKU1 price.</br></br>• <code>GROUP</code></br>Price is based on products in the proposal that have specific catalog tag(s).</br>Format of the <code>price</code> field:</br><code>&lt;LIST_OF_TAGS&gt;;&lt;PERCENTAGE_OF_BASE_PRICE&gt;;&lt;WHICH_PRICE_TO_USE&gt;;&lt;HOW_TO_USE_PRICE&gt;;</code></br>Example:</br><code>"price": "SUPPORT,SW;50;BOTH;AS_IS;"</code></br>Result: 50% of products tagged SUPPORT or SW.</br></br>• <code>FROM_ALL_QUOTE</code></br>Price is based on all other products in the proposal.</br>Format of the <code>price</code> field:</br><code>&lt;PERCENTAGE_OF_OTHER_PRODUCTS_PRICE&gt;</code></br>Example:</br><code>"price": "10"</code></br>Result: 10% of the total price of all other products.</br></br>• <code>NEGATIVE</code></br>Used for negative price products (e.g., discounts). The <code>price</code> value must be negative.</br></br>• <code>GROUP_NEGATIVE</code></br>Negative price based on products in the proposal with specific catalog tag(s). By default, only negative products with the specified tags are considered. To include positive products, set <code>"include_positive": true</code>.</br>Format of the <code>price</code> field:</br><code>&lt;LIST_OF_TAGS&gt;;&lt;PERCENTAGE_OF_BASE_PRICE&gt;;&lt;WHICH_PRICE_TO_USE&gt;;&lt;HOW_TO_USE_PRICE&gt;;</code></br>Example:</br><code>"price": "SUN,FF5;30;NET;AS_IS;"</code></br>Result: 30% of negative products tagged SUN or FF5.</br></br>• <code>ERP</code></br>Price is retrieved from a third-party ERP system during proposal configuration.'
          type: string
          enum:
          - SOLID
          - FROM_ALL_QUOTE
          - ITEM
          - GROUP
          - NEGATIVE
          - GROUP_NEGATIVE
          - ERP
        currency:
          type: string
          description: This field defines how the <code>price</code> value in the pricing rule should be interpreted, especially for tenant accounts configured with multiple currencies.</br></br>Available values:</br></br>• <code>EXCHANGE_RATE</code> (default)</br>Use when the <code>price</code> represents the MSRP in the default account currency. The amount will be converted to the proposal currency configured in CPQ.</br></br>• <code>NO_EXCHANGE_RATE</code></br>Use when the system should treat the <code>price</code> as an absolute value, without performing any currency conversion.</br></br>• <code>&lt;ISO-4217 code&gt;</code></br>Use when a specific currency is explicitly defined for the <code>price</code> and no currency exchange should be performed (e.g., USD, EUR, BRL).</br></br>If <code>null</code> or an empty string is provided, the system treats it as <code>EXCHANGE_RATE</code>. If the price is defined in the default account currency, this field may be <code>null</code>.
        dynamic_price:
          type: boolean
          default: false
          description: Specifies if a seller is allowed to overwrite the list price during proposal configuration. Not applicable when `price_type` is `ERP` or `ITEM`.
        rounding_policy:
          type: string
          description: 'This field defines the ID of the rounding policy explicitly associated with the pricing rule. It is relevant only when a non-default rounding policy must be applied.</br></br>Default: <code>null</code>.</br></br>If a value is provided (not <code>null</code>), the following conditions must be met:</br>1. The account flag <code>enable_rounding_policy</code> must be set to <code>true</code>.</br>2. The <code>price_item_type</code> must be <code>ADVANCED</code>.</br>3. The <code>price_item_currency</code> must not be <code>NO_EXCHANGE_RATE</code>.</br>4. The value must reference an existing rounding policy ID in the system.</br></br>If any of these conditions are not satisfied, the rounding policy will not be applied.'
        max_discount:
          type: integer
          minimum: 0
          maximum: 100
          description: Maximum allowed discount percentage.
        default_discount:
          type: integer
          minimum: 0
          maximum: 100
          description: Default discount percentage.
        apply_to:
          type: string
          enum:
          - ASSIGNMENT_RULES
          - GENERATED_ITEMS
          default: GENERATED_ITEMS
          description: Specifies if the rule applies to all assignments or specific ones.
        apply_to_templates:
          type: string
          description: Comma-separated list of assignment template names for which this pricing rule should be evaluated. Relevant when `apply_to` is `ASSIGNMENT_RULES`.
        apply_to_rules:
          type: string
          description: Comma-separated list of assignment rule names for which this pricing rule should be evaluated. Relevant when `apply_to` is `ASSIGNMENT_RULES`.
        level:
          type: integer
          enum:
          - 0
          - 1
          - 2
          default: 0
          description: The level to be included in the price calculation.
        note:
          type: string
          maxLength: 4096
          description: A free text note for the rule.
        based_of_tags:
          type: string
          description: 'This field specifies the catalog tags used as the baseline for price calculation. The system will sum the prices of products in the proposal that contain the specified tags and use that total as the base amount to calculate the price of the current product.</br></br>Value format: comma-separated list of tags.</br></br>This field must be provided when <code>price_type</code> is <code>GROUP</code> or <code>GROUP_NEGATIVE</code>.'
        based_of_price:
          type: string
          enum:
          - UNIT
          - NET
          - LIST
          - BOTH
          - USER
          - MSRP
          description: 'Specifies which price of the referenced product(s) (matched by <code>based_on_tags</code>) should be used as the base amount for tag-based price calculations.</br></br>When <code>price_type</code> is <code>GROUP</code>, valid values are: <code>UNIT</code>, <code>NET</code>, <code>LIST</code>, <code>BOTH</code>, <code>USER</code>, <code>MSRP</code>.</br></br>When <code>price_type</code> is <code>GROUP_NEGATIVE</code>, valid values are: <code>NET</code>, <code>LIST</code>.'
        limit_type:
          type: string
          enum:
          - MIN
          - MAX
          - AS_IS
          - RANGE
          description: The limit type for tag-based prices. Required if <code>price_type</code> is <code>GROUP</code> or <code>GROUP_NEGATIVE</code>.
        limit_min_value:
          type: number
          description: The minimum limit value for tag-based prices. Required if <code>limit_type</code> is <code>MIN</code> or <code>RANGE</code>.
        limit_max_value:
          type: number
          description: The maximum limit value for tag-based prices. Required if <code>limit_type</code> is <code>MAX</code> or <code>RANGE</code>.
        disable_rounding:
          type: boolean
          description: Specifies if rounding for the price should be disabled.
        include_positive:
          type: boolean
          description: Applicable only when <code>price_type</code> is <code>GROUP_NEGATIVE</code>. Determines whether products with positive prices should also be included in the base amount calculation for the current rule. By default, only products with negative prices (matched by the specified tags) are included. When set to <code>true</code>, both positive- and negative-priced products are considered in the calculation.
        volume_discount:
          $ref: '#/components/schemas/VolumeDiscount'
    VolumeDiscount:
      type: object
      description: 'Defines the volume discount tables associated with the pricing rule. The value must be a key-value map where each entry represents a pair in the format <code>&lt;factor_name&gt;: &lt;volume_discount_table_name&gt;</code>. The <code>factor_name</code> corresponds to the pricing factor (e.g., Quantity, Duration), and the value specifies the volume discount table applied to that factor.</br></br>Example:</br><code>"volume_discount": { "Quantity": "VolD1", "Duration": "VolD2" }</code>'
