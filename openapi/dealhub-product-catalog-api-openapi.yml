      - name
      properties:
        id:
          type: string
          description: System-generated unique identifier for the charge
          readOnly: true
        name:
          type: string
          description: Name of the charge
        displayName:
          type: string
          description: Display name of the charge shown to customers
        description:
          type: string
          description: Detailed description of the charge
        taxRateId:
          type: string
          format: uuid
          description: 'ID of the tax rate applied to this charge. To get a list of available tax rate IDs, call the [Get tax rates](/reference/gettaxrates) operation. DEPRECATED: Use taxRateStrategyId instead. (deprecated: use taxRateStrategyId)'
        taxRateStrategyId:
          type: string
          description: ID of the tax rate strategy applied to this charge. This determines how taxes are calculated when multiple tax rates apply.
        unitOfMeasureId:
          type: string
          format: uuid
          description: ID of the unit of measure for this charge (e.g., GB, users, licenses). To get a list of available unit of measure IDs, call the [Get units of measure](/reference/getunitsofmeasure) operation.
        isRenewable:
          type: boolean
          description: Indicates if the charge is renewable
        isCreditable:
          type: boolean
          description: Indicates if the charge can be credited
        isListPriceEditable:
          type: boolean
          description: Indicates if the list price can be edited
        minQuantity:
          type: integer
          format: int64
          description: Minimum quantity that must be ordered. Applicable only if the chargeModel is PER_UNIT or RATE_CARD_LOOKUP.
        defaultQuantity:
          type: integer
          format: int64
          description: Default quantity for this charge. Applicable only if the chargeModel is PER_UNIT or RATE_CARD_LOOKUP.
        maxQuantity:
          type: integer
          format: int64
          description: Maximum quantity that can be ordered. Applicable only if the chargeModel is PER_UNIT or RATE_CARD_LOOKUP.
        externalId:
          type: string
          description: External identifier for the charge, used for integration with other systems
        minAmount:
          type: number
          description: '**NOTE: This parameter is currently in beta**

            Minimum monetary amount for this charge. Applies only when `type` is `PERCENTAGE_OF`.'
        maxAmount:
          type: number
          description: '**NOTE: This parameter is currently in beta**

            Maximum monetary amount for this charge. Applies only when `type` is `PERCENTAGE_OF`.'
        recognitionRuleId:
          type: string
          description: ID of the revenue recognition rule associated with this charge
        erpId:
          type: string
          description: ERP system identifier for this charge
        itemCode:
          type: string
          description: Item code used for this charge in external systems
        targetPlanIds:
          type: array
          description: List of plan IDs that this PERCENTAGE_OF charge applies to
          items:
            type: string
        creditable:
          type: boolean
      description: JSON object representing the charge details.
    CustomFieldValue:
      type: object
      properties:
        type:
          type: string
          readOnly: true
          enum:
          - STRING
          - PICKLIST
          - MULTISELECT_PICKLIST
        name:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
        value:
          type: string
          readOnly: true
        selections:
          type: array
          readOnly: true
          items:
            type: string
        options:
          type: array
          readOnly: true
          items:
            type: string
        required:
          type: boolean
          readOnly: true
        source:
          type: string
          readOnly: true
          enum:
          - USER
          - SYSTEM
        defaultValue:
          $ref: '#/components/schemas/CustomFieldDefault'
    ProductsBySkuRequest:
      type: object
      required:
      - sku
      properties:
        version_id:
          type: string
          maxLength: 16
          description: ID of the version. If omitted, the active version is used.
        pricing_option:
          type: string
          enum:
          - MIN
          - MAX
          - FIRST
          description: Specifies which price to return for SKUs with multiple fixed prices.
        sku:
          type: array
          items:
            type: string
            maxLength: 200
          description: List of SKUs to retrieve.
    ProductFactor:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: The name of the factor. Must match an existing factor name configured in the CPQ version.
        value:
          type: string
          default: '1'
          description: The factor value. This field may have a value even when the factor is not applicable.
        applicable:
          type: boolean
          default: false
          description: Indicates if the factor is applicable in the context of the assignment rule.
    ProductCatalogPostRequest:
      type: object
      properties:
        products:
          type: array
          description: 'List of products that should be created in the products catalog. Each element in the list contains the following information:'
          items:
            $ref: '#/components/schemas/ProductCatalogItem'
        bundles:
          type: array
          description: 'List of bundles that should be created in the products catalog. Each element in the list contains the following information:'
          items:
            $ref: '#/components/schemas/BundleCatalogItem'
    ProductCatalogPatchBundle:
      type: object
      description: Represents an existing bundle whose data elements should be updated. Only `sku` is required. Include only the data categories (`product_attributes`, `product_assignments`, `product_pricing`, `bundle_items`) that should be updated; omitted categories are left untouched.
      required:
      - sku
      properties:
        sku:
          type: string
          maxLength: 200
          description: The unique identifier of an existing bundle in the catalog.
        product_attributes:
          type: object
          description: 'Bundle attributes to update. Each entry is a key-value pair formatted as `"<attribute_name>": { "value": "<attribute_value>" }`. Attribute names must not exceed 50 characters; attribute values must not exceed 2000 characters. Use `;` as a delimiter for `TEXT_LIST` attribute types.'
          additionalProperties:
            $ref: '#/components/schemas/ProductAttribute'
        product_assignments:
          type: array
          description: Assignment rules to update for this bundle. If `assignment` is `RULE_BASED` or `ALWAYS`, at least one rule must be provided.
          items:
            $ref: '#/components/schemas/BundleAssignment'
        product_pricing:
          description: Pricing definitions to update for this bundle. Can be an empty list if `assignment` is `NEVER`.
          $ref: '#/components/schemas/ProductPricing'
        bundle_items:
          type: array
          description: Products to update within this bundle. Each referenced SKU must already exist in the catalog.
          items:
            $ref: '#/components/schemas/BundleItem'
    ProductCatalogPatchProduct:
      type: object
      description: Represents an existing product whose data elements should be updated. Only `sku` is required. Include only the data categories (`product_attributes`, `product_assignments`, `product_pricing`) that should be updated; omitted categories are left untouched.
      required:
      - sku
      properties:
        sku:
          type: string
          maxLength: 200
          description: The unique identifier of an existing product in the catalog.
        product_attributes:
          type: object
          description: 'Product attributes to update. Each entry is a key-value pair formatted as `"<attribute_name>": { "value": "<attribute_value>" }`. Attribute names must not exceed 50 characters; attribute values must not exceed 2000 characters. Use `;` as a delimiter for `TEXT_LIST` attribute types. Attributes must be pre-declared in the CPQ version.'
          additionalProperties:
            $ref: '#/components/schemas/ProductAttribute'
        product_assignments:
          type: array
          description: Assignment rules to update for this product. The structure of each element is the same as in the POST endpoint. If `assignment` is `RULE_BASED` or `ALWAYS`, at least one rule must be provided.
          items:
            $ref: '#/components/schemas/ProductAssignment'
        product_pricing:
          description: Pricing definitions to update for this product. Can be an empty list if `assignment` is `NEVER`.
          $ref: '#/components/schemas/ProductPricingProduct'
    ProductBasic:
      type: object
      properties:
        sku:
          type: string
          description: Product catalog unique identifier.
        name:
          type: string
          description: Product name.
        type:
          type: string
          enum:
          - PRODUCT
          - BUNDLE
          description: Type of the product.
        description:
          type: string
          description: Product description.
        price:
          type: object
          description: List of price & currency pairs.
          additionalProperties:
            type: string
        attributes:
          type: array
          description: List of all product attributes defined for the version.
          items:
            type: object
            additionalProperties:
              type: string
        bundle_items:
          type: array
          description: List of Product SKUs in the bundle (if type is BUNDLE).
          items:
            type: string
    ProductCatalogPatchRequest:
      type: object
      description: Request body for the PATCH product catalog endpoint. Include only the products and/or bundles whose data elements should be updated.
      properties:
        products:
          type: array
          description: List of existing products whose data elements should be updated. Each element must reference an existing SKU in the catalog.
          items:
            $ref: '#/components/schemas/ProductCatalogPatchProduct'
        bundles:
          type: array
          description: List of existing bundles whose data elements should be updated. Each element must reference an existing bundle SKU in the catalog.
          items:
